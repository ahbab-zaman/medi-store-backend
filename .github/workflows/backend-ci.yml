name: Backend CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "medi-store-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "medi-store-backend/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/medi-store-backend

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine backend directory
        id: find-backend
        run: |
          if [ -f "${GITHUB_WORKSPACE}/package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "${GITHUB_WORKSPACE}/medi-store-backend/package.json" ]; then
            echo "dir=medi-store-backend" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.find-backend.outputs.dir }}

      - name: Run TypeScript compiler check
        run: npm run build
        working-directory: ${{ steps.find-backend.outputs.dir }}
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine backend directory
        id: find-backend
        run: |
          if [ -f "${GITHUB_WORKSPACE}/package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "${GITHUB_WORKSPACE}/medi-store-backend/package.json" ]; then
            echo "dir=medi-store-backend" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        working-directory: ${{ steps.find-backend.outputs.dir }}
        continue-on-error: true

      - name: Run Snyk scan (optional - requires setup)
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high --file=${{ steps.find-backend.outputs.dir }}/package.json
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [lint-and-type-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine backend directory
        id: find-backend
        run: |
          if [ -f "${GITHUB_WORKSPACE}/package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "${GITHUB_WORKSPACE}/medi-store-backend/package.json" ]; then
            echo "dir=medi-store-backend" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.find-backend.outputs.dir }}

      - name: Build project
        run: npm run build
        working-directory: ${{ steps.find-backend.outputs.dir }}
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: ${{ steps.find-backend.outputs.dir }}/dist/
          retention-days: 5

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint-and-type-check]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine backend directory
        id: find-backend
        run: |
          if [ -f "${GITHUB_WORKSPACE}/package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "${GITHUB_WORKSPACE}/medi-store-backend/package.json" ]; then
            echo "dir=medi-store-backend" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ steps.find-backend.outputs.dir }}

      - name: Run tests
        run: npm test
        working-directory: ${{ steps.find-backend.outputs.dir }}
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, security-scan]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine backend directory
        id: find-backend
        run: |
          if [ -f "${GITHUB_WORKSPACE}/package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "${GITHUB_WORKSPACE}/medi-store-backend/package.json" ]; then
            echo "dir=medi-store-backend" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.find-backend.outputs.dir }}
          file: ${{ steps.find-backend.outputs.dir }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
